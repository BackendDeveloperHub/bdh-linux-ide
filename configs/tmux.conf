# =========================================================
# 🖱️ MOUSE & TERMINAL SUPPORT
# =========================================================
setw -g xterm-keys on
set -g mouse on

# =========================================================
# 🔄 PANE NAVIGATION (Laptop & Mobile Support)
# =========================================================
# 💻 Laptop-க்காக: Shift + Arrow keys (S = Shift)
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# 📱 Mobile (Termux)-க்காக: Alt + Arrow keys (M = Meta/Alt)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# =========================================================
# 🌐 WINDOW NAVIGATION (IDE, Server, Browser, Files, Monitor)
# =========================================================
bind -n M-0 select-window -t 0  # Alt + 0 -> IDE
bind -n M-1 select-window -t 1  # Alt + 1 -> Server

# 🔥 Alt + 2 அழுத்தினால் Window 2-க்கு மாறுவதோடு, உங்களின் bdh-browser மூலம் Google ஓபன் ஆகும்!
bind -n M-2 select-window -t 2 \; send-keys C-c "clear && bdh-browser https://google.com" C-m

bind -n M-3 select-window -t 3  # Alt + 3 -> Files
bind -n M-4 select-window -t 4  # Alt + 4 -> Monitor

# வழி 2: Ctrl + Left / Right (அடுத்த/முந்தைய விண்டோவுக்கு வரிசையாக மாற)
bind -n C-Left previous-window
bind -n C-Right next-window

# =========================================================
# 🛑 KILL SESSION
# =========================================================
# எந்த செஷனாக இருந்தாலும் F4 அழுத்தினால் உடனே க்ளோஸ் ஆகும்
bind -n F4 kill-session
